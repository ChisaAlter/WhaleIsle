appId: ai.deepseek.harness.launcher
productName: WhaleIsle Launcher
copyright: MIT
npmRebuild: false
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/koffi-*/**/*

directories:
  output: dist-launcher

files:
  - src/**/*
  - '!**/*.test.js'
  - '!src/native/**'
  - '!src/whale-ui/**'
  - '!src/renderer/whale-ui/**'
  - '!src/renderer/openui/**'
  - '!src/renderer/pet-live2d/**'
  - '!src/renderer/pet/**'
  - '!node_modules/node-pty/**'
  - assets/icon.ico
  - assets/icon.png
  - assets/icon.svg
  - assets/whale-head.png
  - package.json

extraMetadata:
  main: src/main-launcher/index.js
  productName: WhaleIsle Launcher
  dshdPackage: launcher

electronDist: node_modules/electron/dist
compression: maximum
electronLanguages:
  - en-US
  - zh-CN

publish:
  - provider: github
    owner: ChisaAlter
    repo: WhaleIsle

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WhaleIsle Launcher
  artifactName: Whale-Isle-Launcher-Setup-${version}.${ext}
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  license: LICENSE
  include: build/installer.nsh
  installerLanguages:
    - zh_CN
    - en_US
