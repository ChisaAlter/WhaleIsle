# The `whale-girl` agent preset: desktop whale assistant composition.
#
# Persona text is NOT baked here — the dsh-whale host plugin injects a
# `dsh-whale:persona` systemPrompt section resolved from the live settings
# catalog. The empty prefix shadows the deployment default. It must not be
# `complete`: that would discard the dynamic name/personality section.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    includeRuntimeContext: false
    prefix: ''

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

# AGENTS.md is loaded from the home cwd; the host's dsh-whale:memory section
# reads MEMORY.md live on each whale turn.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# She needs fs to maintain her own memory files and skill dirs.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Skills live under the whale home skills dir (toggled via the settings page
# by moving SKILL.md folders between skills/ and skills-disabled/).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: ['__WHALE_SKILLS_DIR__']

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-schedule
  name: '@deepseek-ai/dsh-tool-schedule'

# Keep the long-lived conversation on the same compaction path as Standard.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# Preset-scoped orchestration tools (list/send/new/usage/pet/notify). These
# register into this preset's tools layer only — no global visibility.
- id: whale-tools
  name: 'dsh-whale/tools'
