<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
    <title></title>
    <link rel="stylesheet" href="../shared/dsh-webui-tokens.css">
    <link rel="stylesheet" href="update-dialog.css">
  </head>
  <body class="update-dialog">
    <main id="dialog" role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="title" aria-describedby="detail" hidden>
      <header>
        <div class="title-group">
          <span id="tone-icon" class="tone-icon" aria-hidden="true" hidden></span>
          <h1 id="title"></h1>
        </div>
        <button id="close" class="close" type="button" aria-label="关闭">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
            <path d="M2.5 2.5L13.5 13.5"></path>
            <path d="M13.5 2.5L2.5 13.5"></path>
          </svg>
        </button>
      </header>
      <div id="context" hidden></div>
      <fieldset id="download-methods" hidden><legend>下载方式</legend><div id="download-method-options"></div></fieldset>
      <div id="notes-tabs" role="tablist" aria-label="更新说明语言" hidden></div>
      <div id="content" tabindex="0" role="region" aria-label="详情">
        <p id="detail"></p>
        <section id="request-card" class="request-card" hidden>
          <div id="request-caption" class="request-caption"></div>
          <p id="request-summary" class="request-summary"></p>
          <pre id="request-secret" class="request-secret" tabindex="0" hidden></pre>
          <div id="request-details" class="request-details" hidden></div>
          <p id="request-hint" class="request-hint" hidden></p>
        </section>
        <details id="technical-details" hidden>
          <summary id="technical-details-label"></summary>
          <pre id="technical-details-content" tabindex="0"></pre>
        </details>
      </div>
      <div id="actions"></div>
    </main>
    <script src="update-dialog.js"></script>
  </body>
</html>
