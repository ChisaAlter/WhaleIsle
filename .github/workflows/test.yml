name: Development CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_macos:
        description: Also build the macOS installer
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.changes.outputs.product }}
      vendor: ${{ steps.changes.outputs.vendor }}
      tools: ${{ steps.changes.outputs.tools }}
      motion: ${{ steps.changes.outputs.motion }}
      release: ${{ steps.changes.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs
  tools:
    needs: scope
    if: needs.scope.outputs.tools == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - name: Vendor provenance and artifact consistency
        run: npm run check:vendor
      - name: Checked-in generated artifacts
        run: npm run check:generated
      - name: Unused files, exports and dependencies
        run: npm run check:unused
      - run: npm run test:tools
      - name: checkJs diagnostics baseline
        run: npm run typecheck
  web:
    # Browser lanes for desktop forks of the web composition. They follow the
    # upstream web e2e platform (Linux shell, sandbox and approval semantics).
    needs: scope
    if: needs.scope.outputs.vendor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the shipped Harness profile
        run: npm run setup:harness
      - name: Install the Chromium build apps/web's Playwright pins
        run: node node_modules/pnpm/bin/pnpm.mjs --dir vendor/deepseek-harness/apps/web exec playwright install --with-deps chromium
      - name: Big Fish workbench, panels and task cards
        run: node scripts/run-whale-big-fish-qa.mjs
      - name: Big Fish UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: big-fish-ui
          path: work/whale-big-fish-qa
          if-no-files-found: ignore
          retention-days: 14
      - name: Desktop profile defaults and package reload
        run: node node_modules/pnpm/bin/pnpm.mjs --dir vendor/deepseek-harness exec vitest run packages/boot/app-boot/tests/desktop-pad.spec.ts packages/boot/hmr/tests/package-reload.spec.ts --maxWorkers 2
      - name: Desktop web composition lanes
        run: node node_modules/pnpm/bin/pnpm.mjs --dir vendor/deepseek-harness exec vitest run --config vitest.web.config.ts apps/web/tests/caption-drag-dead-zones.e2e.ts apps/web/tests/approval-resize-geometry.e2e.ts apps/web/tests/composer-typing-keeps-reading.e2e.ts
  windows:
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      LEFTHOOK: '0'
      # CI 先跑 setup:harness/打包准备，前提缺失必须失败而不是跳过
      WHALE_REQUIRE_TEST_PREREQS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check remote dependency lock
        run: npm ci --ignore-scripts --dry-run --no-audit --no-fund
        working-directory: vendor/chisacode-remote
      - run: node node_modules/electron/install.js
      - name: Build the shipped Harness profile
        run: npm run setup:harness
      - name: Whale UI behavior tests
        run: npm run test:whale-ui
      - name: Build the vendored DSHD remote
        run: npm run prepare:dshd-remote
      - name: Desktop behavior tests
        run: npm test
      - name: Scripted source UI walkthrough
        env:
          DSH_QA_EVIDENCE_DIR: work/source-ui-walk
        run: npm run qa:source
      - name: Source UI walkthrough evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-ui-walk-${{ runner.os }}
          path: work/source-ui-walk
          if-no-files-found: warn
          retention-days: 14
      - name: Update download network recovery
        run: npm run qa:update-download
      - name: GUI behavior tests
        if: needs.scope.outputs.vendor == 'true'
        run: node node_modules/pnpm/bin/pnpm.mjs --dir vendor/deepseek-harness run test:gui
      - name: Core behavior tests
        if: needs.scope.outputs.vendor == 'true'
        run: node node_modules/pnpm/bin/pnpm.mjs --dir vendor/deepseek-harness exec vitest run packages/core/agent-loop packages/core/session packages/core/tools packages/llm packages/api/session-controller packages/api/workspace-controller packages/fs/tool-fs packages/workspace packages/session/session-projection-cache packages/subagent/subagent packages/boot/app-boot/tests/desktop-market.spec.ts packages/boot/app-boot/tests/desktop-pad.spec.ts --maxWorkers 2
      - name: Malformed tool recovery
        if: needs.scope.outputs.vendor == 'true'
        run: node node_modules/pnpm/bin/pnpm.mjs --dir vendor/deepseek-harness exec vitest run --config vitest.snapshot.config.ts snapshots/session/headless.snapshot.ts -t "replays malformed-tool-call-retry"
      - name: Hardening & maturity suites
        if: needs.scope.outputs.vendor == 'true'
        env:
          DSH_COVERAGE_TEST_TIMEOUT_MS: '15000'
        run: |
          node node_modules/pnpm/bin/pnpm.mjs --dir vendor/deepseek-harness exec vitest run packages/compaction/compaction-basic packages/compaction/compaction-image-offload packages/compaction/compaction-tool-result-pruner packages/spill/spill-policy packages/fs/fs-observation-policy packages/fs/tool-fs-search packages/fs/tool-str-replace-editor packages/plan/plan-mode packages/todo/tool-todo packages/mcp/mcp-client packages/lsp/lsp packages/lsp/lsp-stdio packages/lsp/tool-lsp packages/subagent/tool-subagent packages/subagent/tool-subagent-control packages/subagent/subagent-dsh-sdk packages/team/tool-agent-team packages/context/time-context packages/skill/skill-filesystem packages/subprocess/subprocess-local/tests/native-windows.spec.ts packages/subprocess/subprocess-local/tests/windows-inspector.spec.ts packages/sandbox/sandbox-windows-acl/tests/acl-failure-paths.spec.ts packages/sandbox/sandbox-windows-acl/tests/acl-skill.spec.ts packages/sandbox/sandbox-windows-acl/tests/ffi.spec.ts packages/sandbox/sandbox-windows-acl/tests/grant-failure-paths.spec.ts packages/sandbox/sandbox-windows-acl/tests/index-failure-paths.spec.ts packages/sandbox/sandbox-windows-acl/tests/path-boundary.spec.ts packages/sandbox/sandbox-windows-acl/tests/provider-chain.spec.ts packages/sandbox/sandbox-windows-acl/tests/workspace-sid.spec.ts --maxWorkers 2
      - name: Maturity eval harness
        run: |
          npm run test:eval-harness
          node scripts/eval-harness.mjs --mode offline
      - name: Built desktop composition
        if: needs.scope.outputs.vendor == 'true'
        run: node scripts/check-skip-compose-contract.js vendor/deepseek-harness
      - name: Built desktop styling
        if: needs.scope.outputs.vendor == 'true'
        run: node scripts/check-built-shell.mjs
      - name: Native window behavior
        if: needs.scope.outputs.motion == 'true'
        run: node scripts/run-window-motion-qa.mjs
      - name: Build Windows installer
        run: npm run dist
      - name: Start the packaged application
        env:
          DSH_SMOKE_TIMEOUT_MS: '600000'
        run: npm run smoke:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Whale-Isle-windows-x64
          path: |
            dist/Whale-Isle-Setup-*.exe
            dist/Whale-Isle-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
  macos:
    # Manual runs on request; the main push that bumps the version always, so
    # Release publishes the DMG with the Windows installer.
    needs: scope
    if: (github.event_name == 'workflow_dispatch' && inputs.include_macos) || needs.scope.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LEFTHOOK: '0'
      WHALE_REQUIRE_TEST_PREREQS: '1'
      # The hosted macOS runner's smaller memory gives Node a ~2 GB default heap,
      # below what the Harness client type check needs; match its own build limit.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/check-mac-icon.js
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run setup:harness
      - name: Build the vendored DSHD remote
        run: npm run prepare:dshd-remote
      - name: Whale UI behavior tests
        run: npm run test:whale-ui
      - run: npm test
      - id: mac_package
        run: npm run dist:mac
      - run: npm run smoke:packaged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Whale-Isle-macos-chrome-evidence
          path: dist/macos-chrome-evidence
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.mac_package.outcome == 'success'
        with:
          name: Whale-Isle-macos-arm64
          path: dist/Whale-Isle-*.dmg
          if-no-files-found: error
          retention-days: 30
  linux-tests:
    # Behavior-test lane mirroring the windows job's product section; catches
    # POSIX-only defects the Windows lane cannot see.
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEFTHOOK: '0'
      WHALE_REQUIRE_TEST_PREREQS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build the shipped Harness profile
        run: npm run setup:harness
      - name: Whale UI behavior tests
        run: npm run test:whale-ui
      - name: Build the vendored DSHD remote
        run: npm run prepare:dshd-remote
      # Ubuntu 24.04 runners restrict unprivileged user namespaces; Electron's
      # Chromium sandbox needs them. CI runner only, tests keep the sandbox on.
      - name: Allow Chromium sandbox user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Desktop behavior tests
        # Electron fixtures open and close the last X client between tests.
        # Keep Xvfb alive without resetting its display while the next client
        # connects; a reset can reject that connection before Electron starts.
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -noreset" npm test
      - name: Scripted source UI walkthrough
        env:
          DSH_QA_EVIDENCE_DIR: work/source-ui-walk
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -noreset" npm run qa:source
      - name: Source UI walkthrough evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-ui-walk-${{ runner.os }}
          path: work/source-ui-walk
          if-no-files-found: warn
          retention-days: 14
      - name: Hardening & maturity suites
        if: needs.scope.outputs.vendor == 'true'
        env:
          DSH_COVERAGE_TEST_TIMEOUT_MS: '15000'
        run: |
          node node_modules/pnpm/bin/pnpm.mjs --dir vendor/deepseek-harness exec vitest run packages/compaction/compaction-basic packages/compaction/compaction-image-offload packages/compaction/compaction-tool-result-pruner packages/spill/spill-policy packages/fs/fs-observation-policy packages/fs/tool-fs-search packages/fs/tool-str-replace-editor packages/plan/plan-mode packages/todo/tool-todo packages/mcp/mcp-client packages/lsp/lsp packages/lsp/lsp-stdio packages/lsp/tool-lsp packages/subagent/tool-subagent packages/subagent/tool-subagent-control packages/subagent/subagent-dsh-sdk packages/team/tool-agent-team packages/context/time-context packages/skill/skill-filesystem --maxWorkers 2
      - name: Maturity eval harness
        run: |
          npm run test:eval-harness
          node scripts/eval-harness.mjs --mode offline
  macos-tests:
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      LEFTHOOK: '0'
      WHALE_REQUIRE_TEST_PREREQS: '1'
      # Same reason as the packaging job: the hosted macOS runner's smaller
      # memory gives Node a ~2 GB default heap, below the client build limit.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build the shipped Harness profile
        run: npm run setup:harness
      - name: Whale UI behavior tests
        run: npm run test:whale-ui
      - name: Build the vendored DSHD remote
        run: npm run prepare:dshd-remote
      - name: Desktop behavior tests
        run: npm test
      - name: Scripted source UI walkthrough
        env:
          DSH_QA_EVIDENCE_DIR: work/source-ui-walk
        run: npm run qa:source
      - name: Source UI walkthrough evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-ui-walk-${{ runner.os }}
          path: work/source-ui-walk
          if-no-files-found: warn
          retention-days: 14
  result:
    name: CI
    if: always()
    needs: [scope, tools, web, windows, macos, linux-tests, macos-tests]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            for (const [name, job] of Object.entries(JSON.parse(process.env.RESULTS))) {
              console.log(name + ": " + job.result);
              if (!["success", "skipped"].includes(job.result)) process.exitCode = 1;
            }
          '
