name: Release macOS single-file diagnosis
on:
  push:
    branches: [codex/release-macos-diagnostic-463b3455]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event_name == 'push'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, jitless]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 463b3455d05806cd725f835c9648fed63a54b5a2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Observe single-file result with TAP details
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [[ "$MODE" == "jitless" ]]; then flags+=(--jitless); fi
          node "${flags[@]}" --test --test-reporter=tap src/renderer/pet-live2d.test.js
  packaged-chrome:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/check-mac-icon.js
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run setup:harness
      - id: mac_package
        run: npm run dist:mac
      - run: npm run smoke:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Whale-Isle-macos-chrome-evidence
          path: dist/macos-chrome-evidence
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.mac_package.outcome == 'success'
        with:
          name: Whale-Isle-macos-arm64
          path: dist/Whale-Isle-*.dmg
          if-no-files-found: error
          retention-days: 30
