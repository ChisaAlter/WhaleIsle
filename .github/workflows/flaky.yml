name: Flaky test detection
# Independent repeated observations: a failure remains red even when another
# round passes. Repair the root cause; never turn this into retry-to-green.
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flaky-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repeated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      LEFTHOOK: '0'
      WHALE_REQUIRE_TEST_PREREQS: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Build the shipped Harness profile
        run: npm run setup:harness
      - name: Whale UI behavior tests
        run: npm run test:whale-ui
      - name: Build optional ChatGPT bundle for native compatibility checks
        run: npm run prepare:dsh-with-chatgpt-bundle
      - name: Build the vendored DSHD remote
        run: npm run prepare:dshd-remote
      - name: Allow Chromium sandbox user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Observe three complete test rounds
        if: runner.os != 'Linux'
        run: node scripts/flaky-report.mjs --repeat 3 flaky-results
      - name: Observe three complete test rounds under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24 -noreset" node scripts/flaky-report.mjs --repeat 3 flaky-results
      - name: Preserve per-round test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flaky-${{ runner.os }}
          path: flaky-results
          if-no-files-found: warn
          retention-days: 14
