name: Magpie CNB mirror
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Official yetone/magpie version X.Y.Z to mirror (blank uses latest)
        type: string
        required: false
      allow_prerelease:
        description: Allow mirroring a prerelease version when version is specified
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: magpie-cnb-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: github.repository == 'ChisaAlter/WhaleIsle'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Mirror official Magpie release to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: ${{ vars.CNB_REPO }}
          MAGPIE_VERSION: ${{ inputs.version }}
          ALLOW_PRERELEASE: ${{ inputs.allow_prerelease && '1' || '' }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-magpie-cnb.mjs
